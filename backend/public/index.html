<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت اپلیکیشن وب ویو</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, button { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ddd; }
        button { background: #28a745; color: white; font-size: 16px; cursor: pointer; margin-top: 20px; border: none; }
        button:hover { background: #218838; }
        .status { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        hr { margin: 20px 0; }
        .note { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 ساخت اپلیکیشن اندروید WebView</h1>
    <form id="buildForm">
        <label>نام اپلیکیشن (مثال: MyApp)</label>
        <input type="text" name="appName" required placeholder="نام نمایشی اپلیکیشن">

        <label>نسخه (مثال: 1.0.0)</label>
        <input type="text" name="version" value="1.0.0">

        <label>پکیج نیم (مثال: com.example.myapp)</label>
        <input type="text" name="packageName" required placeholder="com.example.app">

        <label>آدرس سایت (مثال: https://example.com)</label>
        <input type="url" name="websiteUrl" required placeholder="https://example.com">

        <label>لینک آیکون (PNG - حداقل 512x512)</label>
        <input type="url" name="iconUrl" placeholder="https://example.com/icon.png">
        <div class="note">اگر خالی بماند، آیکون پیش‌فرض استفاده می‌شود</div>

        <label>لینک اسپلش اسکرین (تصویر - اختیاری)</label>
        <input type="url" name="splashUrl" placeholder="https://example.com/splash.png">
        <div class="note">تصویر در صفحه اول اپلیکیشن نشان داده می‌شود</div>

        <label>کد سرور فایربیس (برای نوتیفیکیشن پوش)</label>
        <input type="text" name="firebaseServerKey" placeholder="AAAAA... (از کنسول فایربیس)">
        <div class="note">برای دریافت نوتیفیکیشن نیاز است. از firebase console > settings > cloud messaging</div>

        <label>باز شدن لینک‌های خارجی:</label>
        <select name="openLinks">
            <option value="external" selected>خارج اپلیکیشن (مرورگر پیش‌فرض)</option>
            <option value="inside">داخل اپلیکیشن (WebView)</option>
        </select>

        <button type="submit">🏗️ ساخت اپلیکیشن</button>
    </form>
    <div id="status" class="status"></div>
    <hr>
    <small>پس از کلیک، ساخت اپلیکیشن در گیت‌هاب اکشن شروع می‌شود.</small>
</div>

<script>
    document.getElementById('buildForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = 'status';
        statusDiv.innerText = 'در حال ارسال درخواست...';

        const formData = {
            appName: document.querySelector('[name="appName"]').value,
            version: document.querySelector('[name="version"]').value,
            packageName: document.querySelector('[name="packageName"]').value,
            websiteUrl: document.querySelector('[name="websiteUrl"]').value,
            iconUrl: document.querySelector('[name="iconUrl"]').value,
            splashUrl: document.querySelector('[name="splashUrl"]').value,
            firebaseServerKey: document.querySelector('[name="firebaseServerKey"]').value,
            openLinks: document.querySelector('[name="openLinks"]').value
        };

        try {
            const response = await fetch('/build', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });
            const data = await response.json();
            if (response.ok) {
                statusDiv.className = 'status success';
                statusDiv.innerText = '✅ ' + data.message + ' - ' + (data.firebaseStatus || '');
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerText = '❌ خطا: ' + (data.error || 'مشخص نیست');
            }
        } catch (err) {
            statusDiv.className = 'status error';
            statusDiv.innerText = '❌ خطای شبکه: ' + err.message;
        }
    });
</script>
</body>
</html>
